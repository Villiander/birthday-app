name: my_birthday_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  video_player: ^2.8.2
  just_audio: ^0.9.36
  cupertino_icons: ^1.0.8
  flare_flutter: ^3.0.2
  google_fonts: ^6.1.0
  lottie: ^2.2.0
  flutter_tts: ^4.2.0
  flame: ^1.22.0
  flame_audio: ^2.10.6
  gif: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/sounds/
    - assets/animations/
    - assets/voices/
    - assets/gifs/

